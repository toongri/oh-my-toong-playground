# fc-feedback 모델 비교 평가 전용 명단 — 실제 발행용 명단이 아니다(plan §14.6, §15-8).
#
# 샘플 영상(EAFC24 프로클럽 커뮤니티 C.E.F. / FC Barcelona 팀 연습, 2024-01-04 Part 3,
# https://www.youtube.com/watch?v=NUzEChn9EyI)에서 실제로 확인 가능한 게이머태그만 담는다:
# - HUD 스코어보드에 "9 TIMEJ"로 반복 노출(예: 00:01:04, 00:28:48, 00:48:36, 01:20:48 화면)
# - 코치가 화면에 그린 텔레스트레이터 라벨 "Gerrard_CEF"(00:28:48)와
#   "CEF_VandeVen"(00:19:30)
# 포지션은 이 영상에 선발 포메이션/스쿼드 화면이 없어 전부 코치 발화와 화면 속 위치로만
# 추정했다("# 추정" 주석). alias는 transcript.txt에 남은 ASR 오표기다.
#
# 사용자 확인(2026-09-28): 아래 timej/gerrard/vandeven 세 명 이후로 이어지는 멤버는 화면
# 게이머태그가 전혀 확인되지 않고 코치 음성 언급만 근거로 추가됐다(gold/README.md §5).
# gamertag는 "CEF_<로마자>" 형태의 미확인 placeholder이며 "# 게이머태그 미확인, 발화 기반"
# 주석을 달았다 — 위 세 명과 달리 화면에서 실제로 보이는 값이 아니다. positions도 전부
# "# 추정" 주석과 함께 근거가 된 발화 줄 번호를 남겼다. "존재"처럼 일반명사와 형태가 같은
# 항목도 다른 멤버 이름과 동일하게 "~님" 호칭이 붙어 인명으로 판단해 포함했고, "택배"·"드렐드"는
# "~님" 호칭 없이 전술 용어(오버래핑/패스 종류)로 쓰인 문맥이 뚜렷해 명단에서 제외했다 —
# 근거는 gold/README.md §5.
members:
  - id: timej
    name: TIMEJ
    gamertag: TIMEJ
    role: coach
    positions:
      - ST # 추정: HUD에 "9 TIMEJ"로 표기, 28:48·80:48 공격 전개 위치(선발 포지션 화면 없음)

  - id: gerrard
    name: Gerrard_CEF
    gamertag: Gerrard_CEF
    positions:
      - CM # 추정: 28:48 센터서클 부근 위치 + 08:12 코치 발화("베라드 님이 여기서 탈압박
        # 해서 앞으로 넣어도") 기준(선발 포지션 화면 없음)
    aliases:
      - 베라드
      - 제라드

  - id: vandeven
    name: CEF_VandeVen
    gamertag: CEF_VandeVen
    positions:
      - CB # 추정: 19:30 자책 경합 시 최종 수비 라인 부근 위치 기준(선발 포지션 화면 없음)

  - id: bride
    name: 브라이드
    gamertag: CEF_Bride # 게이머태그 미확인, 발화 기반
    positions:
      - MF # 추정: i=5 "브라이드님에서 제 쪽으로 오는 볼이 많다" — 전방(ST)에게 롱패스를 배급하는
        # 후방 플레이메이커로 추정(선발 포메이션 화면 없음, 확신도 낮음)

  - id: taxi
    name: 택시
    gamertag: CEF_Taxi # 게이머태그 미확인, 발화 기반
    positions:
      - MF # 추정: i=23 "내 주변 택시가 자꾸 포를 잡으면" — 근거가 "코치 근처에서 자주 공을 뺏김" 뿐이라
        # 확신도 매우 낮음

  - id: jomin
    name: 조민
    gamertag: CEF_Jomin # 게이머태그 미확인, 발화 기반
    positions:
      - MF # 추정: i=36 유닛 도입부에서 호명되나 본문은 파인드/루미/기프/유미의 역습 배치를 설명해
        # 조민 본인의 위치는 직접 서술되지 않음(확신도 매우 낮음)

  - id: find
    name: 사인드
    gamertag: CEF_Find # 게이머태그 미확인, 발화 기반
    positions:
      - FW # 추정: i=40 "파인드님이 낮으니 루미님이 윙어 역할을 수행해야" — 평소 측면 공격 역할을
        # 대신할 사람이 필요할 만큼 낮게 내려온 상황 + i=127 "사인드님이 중앙으로 들어갑니다"
        # (중앙 침투)로 미루어 측면 공격수 계열로 추정(좌우 미상)
    aliases:
      # name을 "파인드"(3회, 최빈 표기)가 아니라 "사인드"(2회)로 둔 이유: media.ts의
      # applyAliases가 alias 길이 내림차순으로 순차 치환(.split().join())하는데, "파인"이
      # "파인드"의 접두 부분 문자열이라 "파인드"를 name으로 두면 원문에 이미 있던 "파인드"까지
      # "파인" 규칙에 다시 걸려 "파인드드"로 중복 치환된다(evals/fc-feedback/gold/README.md
      # §5.1에서 실측 확인, media.ts는 이 작업 범위 밖이라 수정하지 않음 — roster 쪽에서
      # 접두어 충돌을 피하는 쪽으로 우회)
      - 파인드
      - 파인

  - id: rumi
    name: 루미
    gamertag: CEF_Rumi # 게이머태그 미확인, 발화 기반
    positions:
      - FW # 추정: i=40 "루미님이 윙어 역할을 수행해 줘야" — "윙어" 직접 언급(좌우 미상)

  - id: gipeu
    name: 기프
    gamertag: CEF_Gipeu # 게이머태그 미확인, 발화 기반
    positions:
      - FW # 추정: i=44-45 "기프님이 가까운 쪽에 있는 저(ST)를 주든" — 역습 시 ST와 나란한 패스
        # 옵션으로만 언급되어 확신도 낮음

  - id: yumi
    name: 유미
    gamertag: CEF_Yumi # 게이머태그 미확인, 발화 기반
    positions:
      - FW # 추정: i=46 "유미님을 선택하여 두 개의 옵션을 열 수 있다" — 기프와 같은 역습 공격 옵션
        # 문맥(확신도 낮음)

  - id: saembaek
    name: 샘백
    gamertag: CEF_Saembaek # 게이머태그 미확인, 발화 기반
    positions:
      - FW # 추정: i=73-74 "샘백한테 보내서 수비를 딸려가기" — 수비를 끌어내는 공격 옵션으로 추정

  - id: giseun
    name: 기슨
    gamertag: CEF_Giseun # 게이머태그 미확인, 발화 기반
    positions:
      - MF # 추정: i=107 "카펄을 제가(ST) 잡거나 기슨이 잡거나" — 앞뒤 문맥 ASR 파손이 심해
        # 확신도 매우 낮음(ST의 대안 수신자라는 것 외엔 근거 없음)

  - id: jonjae
    name: 존재
    gamertag: CEF_Jonjae # 게이머태그 미확인, 발화 기반
    positions:
      - FW # 추정: i=117-120 "존재님이 넓은 공간 활용... 크로스를 하든 컵백을 하든" — 넓은 공간
        # 침투 후 크로스/컵백까지 언급돼 측면 공격수 계열로 추정

  - id: wonjeon
    name: 원전
    gamertag: CEF_Wonjeon # 게이머태그 미확인, 발화 기반
    positions:
      - FB # 추정: i=122 "원전이 올라가고 있잖아요", i=126 "원장님이 올라가게 해서 사이드 먹기",
        # i=155 "원전임이 한번 밸런스 무너뜨렸는데"(수비라인 유닛) — 전진 드리블 + 측면 점유 +
        # 수비라인 균형과 엮여 오버래핑 풀백/윙백으로 추정
    aliases:
      - 원장

  - id: spress
    name: 스프레스
    gamertag: CEF_Spress # 게이머태그 미확인, 발화 기반
    positions:
      - CAM # 추정: i=145-148 "스프레스님 보면은 타프를 넣어주는데 팀 플레이상 유효타를" — 파이널서드
        # 배급 역할로 추정(확신도 낮음, "타프" 의미 불명)

  - id: maekgu
    name: 맥구
    gamertag: CEF_Maekgu # 게이머태그 미확인, 발화 기반
    positions:
      - FW # 추정: i=169-176 "솔로로 돌파하다 막힘", i=180-181 "택배에게 주고 오버래핑" — 측면에서
        # 단독 돌파를 시도하는 공격수 계열로 추정
    aliases:
      - 맥주
