path: "~"

# codegraph 바이너리 전역 설치 (PATH 체크라 디렉토리 무관 → 루트에서 1회).
# 인덱스 빌드(codegraph init)는 sync가 하지 않는다 — bare 레포 fan-out 탓에
# worktree마다 전체 인덱싱이 돌아 stale 워크트리까지 수십 GB를 만들었다.
# 인덱스가 필요한 레포에서 직접 `codegraph init`을 1회 실행할 것.
provision:
  - check: "command -v codegraph"
    commands:
      - "npm i -g @colbymchenry/codegraph"
  # 존재만으론 부족 — skills/agent-device/SKILL.md:18이 >= 0.20.0을 요구하고
  # 미달 시 멈춘다. 낡은 설치본이 있으면 "command -v"는 통과해버려 업그레이드가
  # 안 도는 구멍이 있었다. semver를 grep으로 뽑아 sort -V로 0.20.0과 비교한다
  # (macOS BSD sort -V가 semver를 올바르게 정렬함을 실측).
  - check: 'v=$(agent-device --version 2>/dev/null | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1); [ -n "$v" ] && [ "$(printf "%s\n%s\n" 0.20.0 "$v" | sort -V | head -1)" = 0.20.0 ]'
    commands:
      - "npm i -g agent-device@latest"
  # CLI 존재 체크. skills/agent-browser/SKILL.md:14의 설치 계약은
  # `npm i -g agent-browser && agent-browser install` 두 단계라 CLI만으론
  # Chrome이 없는 상태가 존재한다 — 아래 항목이 그 두 번째 단계를 검사한다.
  # 이 항목이 먼저 와야 신규 머신에서 CLI 자체가 없을 때 doctor 체크가
  # 무의미하게 먼저 도는 일이 없다.
  - check: "command -v agent-browser"
    commands:
      - "npm i -g agent-browser@latest"
  # doctor의 Chrome 섹션은 `  pass  Google Chrome for Testing <ver> at <path>`
  # 형태로 출력된다(실측). 앵커를 느슨하게 둔 이유: 상류 출력 포맷이 바뀌면
  # 이 체크가 실패해 `agent-browser install`(멱등)이 도는 쪽으로 흐르게
  # 하려는 것 — fail-toward-provisioning이 안전한 방향이다.
  - check: 'agent-browser doctor 2>&1 | grep -qE "pass +Google Chrome"'
    commands:
      - "agent-browser install"

# ultragoal의 실행 체인 중 에이전트 절반. 아래 skills의 sisyphus·
# code-review와 짝이며, 넷이 다 있어야 체인이 닫힌다 — sisyphus가 실행을
# sisyphus-junior에게, 완료 게이트가 리뷰를 code-reviewer에게 위임한다.
# feature-platforms.agents가 [claude, codex]라 bare 선언으로 충분하다.
agents:
  items:
    - code-reviewer
    - sisyphus-junior

skills:
  items:
    # ultragoal의 실행 체인 중 스킬 절반. ultragoal은 모든 실행을 sisyphus에
    # 위임하므로, 이 둘 없이 ultragoal만 배포하면 첫 실행 디스패치에서 멈춘다.
    # 아래에서 ultragoal을 codex로 여는 이상 sisyphus·code-review도 같은
    # 플랫폼 집합으로 배포되어야 한다.
    # sisyphus는 하네스 중립 감사에서 결함이 나와 고친 사례다. hooks/skill-catalog/의
    # 프로그램 파일을 세 축에서 두 하네스 모두 동작하도록 바꿨다: 스킬 디렉터리
    # 탐색이 <repo>/.claude/skills와 <repo>/.agents/skills(codex 착지점,
    # tools/adapters/codex.ts:158) 양쪽을 보고, <home>/.claude/settings.json의
    # enabledPlugins는 CODEX_THREAD_ID가 감지되면 항상 빈 Set으로 단락하며
    # (Codex는 플러그인 미지원 — tools/adapters/codex.ts:862), catalog.ts의
    # discovered-only 안내 문구는 harness에 따라 Skill(skill: "X") 대 $X
    # mention sigil을 런타임에 방출한다(rewrite 규칙 6a와 동일 문법).
    - component: sisyphus
      platforms: [claude, codex]
    - component: code-review
      platforms: [claude, codex]
    # hud는 Claude Code 전용 statusline 기능 — settings.local.json·claudeAiOauth를 읽고
    # ${CLAUDE_SKILL_DIR}/../../ 경로로 리졸브하므로 Codex/Gemini/OpenCode엔 존재하지 않음.
    - component: hud
      platforms: [claude]
    - component: pin-record
      platforms: [claude, codex]
    - component: pin-query
      platforms: [claude, codex]
    - component: pin-audit
      platforms: [claude, codex]
    - component: pin-wrap-up
      platforms: [claude, codex]
    - component: pin-setup
      platforms: [claude, codex]
    - scan-pdf-to-notes
    - component: meeting-notes
      platforms: [claude, codex]
    # 전역 등록된 SessionStart 훅 orphan-reaper.sh(claude.yaml)가
    # $HOME/.claude/skills/orchestrate-review/scripts/job.ts를 참조한다.
    # 전역 배포가 없으면 대상 파일이 없어 그 훅이 fail-open으로 조용히
    # 무력화된다.
    # SKILL.md는 명령을 ${CLAUDE_SKILL_DIR}로 적는다(12곳). claude는 이를
    # 스킬 주입 시점에 런타임으로 확장하고, codex는 sync 시점에 tools/sync.ts의
    # bakeSkillDirToken이 절대경로로 구워 넣는다. gemini/opencode는 둘 중
    # 어느 쪽도 없어 변수가 미해석 상태로 남고, 그 결과 동작하지 않는다
    # (실측: 배포된 SKILL.md에 ${CLAUDE_SKILL_DIR} 12곳이 그대로 남음).
    - component: orchestrate-review
      platforms: [claude, codex]
    # codex 개방 근거는 두 겹이고, 두 겹이 다 필요하다.
    # (1) .md — rewrite 규칙 6a가 Skill() 호출을 $X mention sigil로 치환한다
    #     (tools/lib/rewrite-rules.ts의 id "6a" 규칙). make validate의 codex-rewrite
    #     스캐너가 uncovered 0건으로 실측했다. 단 그 스캐너는 .md만 본다
    #     (tools/validators/components.ts:663-664) — 그래서 (2)가 따로 필요하다.
    # (2) 프로그램 파일 — codex 타겟에도 그대로 복사되지만 절대 rewrite되지
    #     않으므로(tools/sync.ts의 rewriteFilesUnder — collectMdFiles로 .md만
    #     수집하며, 그 doc comment가 프로그램 파일은 "deliberately NEVER walked
    #     here"라고 명시) (1)의 실측이 덮지 못한다. ultragoal의
    #     상태 스크립트를 전수 감사해, 세션 ID와 OMT 디렉터리를 공유 코어
    #     (@lib/state-core의 resolveSessionIdOrThrow, @lib/omt-dir의 getOmtDir)에
    #     위임함을 확인했다. 둘 다 env가 없을 때 cwd에서 유도하므로, OMT_DIR·
    #     OMT_SESSION_ID를 나르는 CLAUDE_ENV_FILE이 존재하지 않는 Codex에서도
    #     동작한다(hooks/session-start.sh:61-68, hooks/codex-ledger.sh:44-58).
    #     prometheus에서도 이 (2) 축에서 결함이 나와 고쳤다 — getOmtDir()를
    #     로컬 재구현해 OMT_DIR env가 없으면 throw했는데, 그 env는
    #     CLAUDE_ENV_FILE로만 전달되고 그 파일은 Codex에 없다
    #     (hooks/codex-ledger.sh:44-58). 형제 4개처럼 @lib/omt-dir의 공유
    #     getOmtDir(env→git repo명→cwd 폴백)로 교체했다.
    - component: ultragoal
      platforms: [claude, codex]
    - agent-device
    - agent-browser
    - dogfood
    - component: receiving-code-review
      platforms: [claude, codex]
    - component: test-driven-development
      platforms: [claude, codex]
    - component: writing-skills
      platforms: [claude, codex]
    # frontend는 웹 UI 작업의 공통 진입점이므로 프로젝트별 중복 없이 전역 배포해야 한다.
    # 이식본이 Claude·Codex 스킬 루트만 지원하므로 Gemini/OpenCode 과배포를 막기 위해 플랫폼을 좁힌다.
    - component: frontend
      platforms: [claude, codex]
    # visual-qa는 모든 UI 변경의 독립 검증 게이트라 전역 호출 가능해야 한다.
    # agent-browser 기반 Claude·Codex 이식본만 검증되었으므로 Gemini/OpenCode 배포는 제외한다.
    - component: visual-qa
      platforms: [claude, codex]
    # explain-diff의 강제 게이트는 양 플랫폼에 이미 깔려 있다 — 시드 훅
    # (pre-tool-enforcer.sh의 explain-diff 케이스 / codex-explain-diff-seed.sh)과
    # fail-closed 아티팩트 가드 twin이 claude.yaml·codex.yaml에 등록돼 있으므로,
    # 스킬만 한쪽에 배포하면 다른 쪽 게이트가 대상 없이 남는다.
    # ${CLAUDE_SKILL_DIR} 는 claude가 런타임 확장, codex는 sync 시점
    # bakeSkillDirToken이 절대경로로 굽는다 — 그래서 이 둘로만 좁힌다.
    - component: explain-diff
      platforms: [claude, codex]

scripts:
  items:
    # verify-entrypoint-gate: entrypoint 화이트리스트를
    # package.json scripts와 실시간 교집합해 존재하지 않는 스크립트를 안내하지 않는다.
    # scripts로 배포(등록 없음)하여 $HOME/.claude/scripts/verify-entrypoint-gate/ +
    # $HOME/.codex/scripts/verify-entrypoint-gate/ 두 단일본으로 두고, 실제 hook 등록은
    # projects/acme-home/claude.yaml(Bash matcher, 프로젝트 스코프)과 루트
    # codex.yaml(Bash|bash|exec_command|shell_command matcher, 전역)이 각각 raw
    # command로 이 경로를 참조한다 — processHookInput이 두 플랫폼의 payload 모양
    # (tool_name 대소문자, command/cmd, cwd/workdir)을 모두 받아 같은 decide() 코어로
    # 판정한다. 두 등록의 스코프가 갈리는 이유와, 전역 등록이 다른 레포를 물지 않게
    # 하는 무장 규칙(오버레이 존재)은 루트 codex.yaml의 해당 항목 주석에 있다.
    # base 정책 verify-entrypoint-gate.yaml은 index.ts가 import.meta.url 기준(자기 옆)으로
    # 로드하지만, 프로젝트 오버레이 .local.yaml은 대상 워크스페이스 루트 기준으로 로드한다
    # — 이 2층 분리가 구 게이트의 구조적 버그를 고친 지점. 구 loadConfig는 base·local을
    # 둘 다 스크립트 자기 디렉터리에서 해석해서, 전역 단일본 배포 하에선 "프로젝트별
    # 오버라이드"마저 전역 단일본이었다(어느 프로젝트에서 실행해도 같은 파일을 봤다).
    - component: verify-entrypoint-gate
      platforms: [claude, codex]
    - component: pretool-trace
      platforms: [claude, codex]

rules:
  items:
    - answer-grounding
    - architecture-boundaries
    - communication-style
    - continuation-contract
    - convention-grounding
    - verification-discipline
    - e2e-driver-usage
    - outbound-local-reference
    - toolchain-mise
