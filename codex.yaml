# MCP definitions for Codex.
# Note: Figma uses Codex remote MCP config; gemini still uses mcp-remote.

# This key MUST stay declared rather than be deleted, whatever it holds.
# It previously held `agents.max_depth`, removed once that key was measured
# inert on the V2 spawn path (codex-spawn-depth-gate.sh now enforces that cap
# instead). Deleting the whole `config:` key is not equivalent to emptying it:
# syncPlatformYaml only calls syncConfig when `yaml.config` is present
# (tools/adapters/codex.ts:715), so with the key absent the deployed
# `.codex/config.toml` keeps whatever its `# --- omt:config ---` block last
# received -- forever, on every subsequent sync. Installs synced before the
# removal would silently retain `[agents] max_depth = 2` while fresh installs
# get nothing, so "the key is gone" would be true only for new machines.
# Any declared mapping -- empty or not -- keeps syncConfig reachable;
# insertManagedBlock replaces the block wholesale each sync, so the deployed
# block always matches exactly what's declared here, never a stale carryover.
config:
  features:
    multi_agent_v2:
      # MultiAgentV2 defaults to 4 concurrent threads per session (root
      # included). This machine's model (gpt-5.6-terra) forces V2, so
      # subagent parallel fan-out was capped at 4. This is the canonical
      # override key -- the old `agents.max_threads` is ignored under V2.
      # Do NOT add `enabled = true` here: it would force V1-model sessions
      # into V2 too, which is out of scope for this change.
      max_concurrent_threads_per_session: 20

model-map:
  # Tiers set the model only. Omitting `effort` leaves `model_reasoning_effort`
  # out of the emitted role TOML (tools/adapters/codex.ts:55), so each agent runs
  # at whatever effort the session is configured for instead of a value frozen at
  # sync time.
  tiers:
    # Every tier named here is load-bearing regardless of what it resolves to:
    # `assertMappedTier` (tools/lib/model-map.ts:22) aborts sync for any
    # deployed agent whose tier is absent here -- delete `fable` and
    # `agents/metis.md` stops deploying to codex with a named ModelMapError.
    fable:
      model: gpt-5.6-sol
    opus:
      model: gpt-5.6-terra
    sonnet:
      model: gpt-5.6-luna
  # `agents:` is for what a tier cannot express. With tiers carrying model alone,
  # that is effort: an agent that must pin an effort rather than follow the
  # session. It previously held code-reviewer/metis/momus/tech-claim-examiner,
  # all four byte-identical to `tiers.opus`, so they resolved to the same TOML
  # either way and were removed. A new entry must name what tier it could not
  # be expressed as. Unlike `config:` above, an absent key is safe here:
  # resolution is `modelMap.agents?.[name] ?? modelMap.tiers[tier]`
  # (tools/adapters/codex.ts:54), and agent TOMLs are rewritten wholesale
  # (codex.ts:431), so nothing stale survives a sync.
hooks:
  SessionStart:
    - component: rules-injector
      type: command
      command: "bun run .codex/hooks/rules-injector/cli.ts hook session-start"
    - component: codex-ledger.sh
      type: command
    # Claude<->Codex hook-parity: root claude.yaml registers pin-session-start
    # globally (SessionStart), so its Codex analog is global too. pin-session-
    # start needs no Codex-specific shim: its own logic already reads only
    # `.cwd` (never a Claude-only session-id shape -- see hooks/pin-session-
    # start/index.ts) and never emits Claude's `continue` key, so the SAME
    # component deploys unmodified to both platforms.
    - component: pin-session-start
      type: command
      timeout: 10
  UserPromptSubmit:
    - component: rules-injector
      type: command
      command: "bun run .codex/hooks/rules-injector/cli.ts hook user-prompt-submit"
    - component: codex-qa-seed.sh
      type: command
      timeout: 10
    - component: codex-explain-diff-seed.sh
      type: command
      timeout: 10
    # Claude<->Codex hook-parity: root claude.yaml registers keyword-detector.sh
    # globally (UserPromptSubmit), so its Codex analog is global too -- see
    # hooks/codex-keyword-detector.sh + shared hooks/keyword-detector-core.sh.
    - component: codex-keyword-detector.sh
      type: command
      timeout: 10
  PreToolUse:
    - component: codex-qa-seed.sh
      type: command
      matcher: "Bash|bash|exec_command|shell_command"
      timeout: 10
    - component: codex-explain-diff-seed.sh
      type: command
      matcher: "Bash|bash|exec_command|shell_command"
      timeout: 10
    # The artifact gate itself. Unlike every sibling guard here it fails CLOSED
    # on its own directory. Matcher covers exactly the Codex write-tool
    # spellings the shim handles; shell redirects into the guarded directory are
    # out of scope on both platforms (see claude.yaml's twin registration).
    - component: codex-explain-diff-artifact-guard.sh
      type: command
      matcher: "apply_patch|write_file|edit_file|create_file"
    - component: codex-write-guard.sh
      type: command
      matcher: "Bash|bash|apply_patch|exec_command|shell_command|Edit|Write|edit|write|multiedit|multi_edit"
    # Claude<->Codex hook-parity: the QA driver gate consumes the same
    # persisted active/derived booleans and blocks agent-browser/device on all
    # three Codex shell-tool spellings.
    - component: codex-qa-driver-guard.sh
      type: command
      matcher: "Bash|bash|exec_command|shell_command"
    # Claude<->Codex hook-parity: root claude.yaml registers label-commit-gate.sh
    # globally (PreToolUse, matcher "Bash"), so its Codex analog is global too --
    # see hooks/codex-label-commit-gate.sh + shared hooks/label-commit-gate-core.sh.
    - component: codex-label-commit-gate.sh
      type: command
      matcher: "Bash|bash|exec_command|shell_command"
    # Claude<->Codex hook-parity: inspect staged/local-path citations before
    # commits and outbound PR/API/MCP writes. The matcher is a full-string
    # regex and deliberately names only currently configured write tools so
    # read-only Notion/Slack/Linear routes are never inspected or denied.
    - component: codex-local-path-ref-gate.sh
      type: command
      matcher: "Bash|bash|exec_command|shell_command|mcp__notion__notion_convert_page_to_skill|mcp__notion__notion_create_attachment|mcp__notion__notion_create_comment|mcp__notion__notion_create_database|mcp__notion__notion_create_file_upload|mcp__notion__notion_create_folder|mcp__notion__notion_create_pages|mcp__notion__notion_create_view|mcp__notion__notion_duplicate_page|mcp__notion__notion_move_pages|mcp__notion__notion_update_data_source|mcp__notion__notion_update_page|mcp__notion__notion_update_view|mcp__slack__slack_add_reaction|mcp__slack__slack_create_canvas|mcp__slack__slack_create_conversation|mcp__slack__slack_schedule_message|mcp__slack__slack_send_message|mcp__slack__slack_send_message_draft|mcp__slack__slack_update_canvas|mcp__linear__create_attachment|mcp__linear__create_attachment_from_upload|mcp__linear__create_initiative_label|mcp__linear__create_issue_label|mcp__linear__delete_attachment|mcp__linear__delete_comment|mcp__linear__delete_diff_comment|mcp__linear__delete_status_update|mcp__linear__merge_diff|mcp__linear__prepare_attachment_upload|mcp__linear__resolve_diff_thread|mcp__linear__save_comment|mcp__linear__save_diff_comment|mcp__linear__save_document|mcp__linear__save_initiative|mcp__linear__save_issue|mcp__linear__save_milestone|mcp__linear__save_project|mcp__linear__save_release|mcp__linear__save_release_note|mcp__linear__save_status_update|mcp__linear__submit_diff_review"
    # Claude<->Codex hook-parity: root claude.yaml registers review-exec-guard.sh
    # globally for Bash, so its Codex analog covers every root-config shell-tool
    # spelling. Codex applies this matcher as a full-string regex.
    - component: codex-review-exec-guard.sh
      type: command
      matcher: "Bash|bash|exec_command|shell_command"
    # verify-entrypoint-gate — 무필터 test/lint deny + entrypoint 화이트리스트.
    # 이 훅만 전역에 있는 이유가 다른 항목들과 다르다. 나머지는 "루트 claude.yaml이
    # 전역이니 Codex도 전역"이라는 패리티 미러지만, 이건 Claude 짝이 여전히
    # projects/acme-home/claude.yaml에 프로젝트 스코프로 남아 있다. Codex만
    # 전역인 건 착지점이 달라서다 — Claude는 gitignore된 settings.local.json에
    # 떨어지지만, Codex의 프로젝트 등록은 대상 레포가 git으로 추적하는
    # `<repo>/.codex/hooks.json`에 떨어지고 어댑터가 그 파일의 `hooks` 키를 통째로
    # 교체하므로(tools/adapters/codex.ts의 updateSettings) 팀이 커밋해둔 훅을
    # 덮어쓴다. 실제로 그렇게 됐다: acme-home 워크트리 8곳에서 팀의
    # rules-injector 훅 4종이 지워졌다.
    #
    # 전역 등록으로 acme-home 안에서도 정상 발동한다 — codex-cli 0.145.0
    # 실측(격리 CODEX_HOME 4 arm): 전역 hooks.json과 레포 hooks.json은 합쳐져
    # 둘 다 실행된다(레포 쪽은 config.toml에 그 프로젝트가 trust_level = "trusted"로
    # 등록돼 있을 때만 산다).
    #
    # 전역 등록이라 이 훅은 모든 레포에서 호출되지만, 판정 여부는 배포된 오버레이
    # 정책(verify-entrypoint-gate.local.yaml) 존재가 결정한다 —
    # scripts/verify-entrypoint-gate/index.ts의 findOverlayDir. 오버레이가 없는
    # 레포(pnpm 워크스페이스가 아예 없는 곳 포함)는 판정 없이 통과시킨다.
    #
    # command의 `.codex/`는 어댑터가 배포 루트 기준 절대경로로 재작성한다
    # (codex.ts:832). 이 파일의 타겟은 루트 sync.yaml의 `~`이므로
    # $HOME/.codex/scripts/... 로 착지한다 — 스크립트 전역 단일본의 실제 위치이며,
    # 프로젝트 스코프 시절 필요했던 따옴표 분할 회피 트릭도 이제 필요 없다.
    - command: "bun run .codex/scripts/verify-entrypoint-gate/index.ts"
      matcher: "Bash|bash|exec_command|shell_command"
      timeout: 10
    # NOT a Claude<->Codex hook-parity mirror -- Claude enforces the same
    # nested-spawn-depth policy natively via the CLAUDE_CODE_MAX_SUBAGENT_
    # SPAWN_DEPTH env var, so it has no matching hook. This hook exists only
    # because codex has no working native depth cap on this version's V2
    # spawn path -- see the codex-spawn-depth-gate.sh entry in CLAUDE.md's
    # Hooks section for why, so a hook is the only enforcement point.
    #
    # matcher MUST be ".*[sS]pawn_[aA]gent", never "spawn_agent" or
    # "^spawn_agent$": Codex's PreToolUse matcher is a full-string regex
    # match, and the actual tool name observed at runtime is
    # "collaborationspawn_agent" (not "spawn_agent"). A bare "spawn_agent" or
    # anchored "^spawn_agent$" never matches that string, so the hook would
    # silently never fire -- passing both deploy and this repo's own tests
    # while doing nothing at runtime.
    #
    # The [sS]/[aA] case classes exist so the hook body's own defense
    # against a mixed-case variant (codex-spawn-depth-gate.sh:84's
    # `tr '[:upper:]' '[:lower:]'` lowercasing before the `*spawn_agent`
    # case match) is actually reachable -- that lowercasing only runs after
    # this matcher has already let the call through, so a matcher that
    # can't match a mixed-case form leaves the hook's own defense as dead
    # code below it. Limitation: an ALL-CAPS variant
    # ("COLLABORATIONSPAWN_AGENT") is still uncovered by this matcher --
    # "[sS]pawn" doesn't match "PAWN" and "[aA]gent" doesn't match "GENT",
    # since each class only covers the word's first letter. The hook
    # body's `tr` lowercases the whole string and would cover this case if
    # reached, but this matcher gate never lets it through.
    - component: codex-spawn-depth-gate.sh
      type: command
      matcher: ".*[sS]pawn_[aA]gent"
    - component: codex-review-dispatch-gate.sh
      type: command
      matcher: ".*[sS]pawn_[aA]gent"
  PostToolUse:
    - component: rules-injector
      type: command
      matcher: "Bash|bash|apply_patch|exec_command|shell_command|Edit|Write"
      command: "bun run .codex/hooks/rules-injector/cli.ts hook post-tool-use"
    - component: codex-persistent-mode
      type: command
      # update_plan feeds the baseline todo-continuation writer; bash/shell_command/
      # exec_command additionally feed the skill-chain ratchet writer (SKILL.md opens
      # are read via a shell command, not a dedicated file-read tool — see cli.ts's header).
      matcher: "^update_plan$|Bash|bash|exec_command|shell_command"
      command: "bun run .codex/hooks/codex-persistent-mode/cli.ts hook post-tool-use"
    # Claude<->Codex hook-parity: root claude.yaml registers label-edit-warn.sh
    # globally (PostToolUse, matcher "Write|Edit|MultiEdit"), so its Codex analog
    # is global too -- see hooks/codex-label-edit-warn.sh + shared hooks/label-
    # edit-warn-core.sh.
    - component: codex-label-edit-warn.sh
      type: command
      matcher: "apply_patch|Edit|Write|edit|write|multiedit|multi_edit"
  PostCompact:
    - component: rules-injector
      type: command
      command: "bun run .codex/hooks/rules-injector/cli.ts hook post-compact"
  Stop:
    - component: codex-persistent-mode
      type: command
      command: "bun run .codex/hooks/codex-persistent-mode/cli.ts hook stop"

mcps:
  # Figma hosted MCP. Codex handles this as a streamable HTTP server with OAuth login.
  figma:
    url: "https://mcp.figma.com/mcp"
  # codegraph local code-graph MCP (Tree-sitter -> SQLite call graph; 100% local, no API key).
  # Requires per-machine binary (`npm i -g @colbymchenry/codegraph`) and per-repo `codegraph init` to build the index.
  codegraph:
    command: codegraph
    args:
      - "serve"
      - "--mcp"
