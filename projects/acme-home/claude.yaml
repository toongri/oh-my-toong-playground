# config·hooks·mcps는 대상 프로젝트의 .claude/settings.local.json으로 배포된다
# (전역 sync만 settings.json). settings.local.json은 대상 레포에서 gitignore되므로
# (acme-home .gitignore) 여기 둔 개인 절대경로도 팀 레포엔 커밋되지 않는다.
# OMT의 claude.yaml(git 추적)과 claude.local.yaml(gitignore)은 "OMT 레포에
# 버전관리하느냐"의 축일 뿐 — 배포 착지점은 둘 다 gitignore된 settings.local.json.
# 메커니즘 전문: docs/platform-yaml-config-deployment.md
config:
  env:
    # 워크트리 공유 turbo 캐시(해시키드 경로 지정, 캐시 무효화 아님).
    TURBO_CACHE_DIR: "/Users/toong/Library/Caches/acme-home/turbo"
  # acme-home 레포에 직접 커밋된(OMT 미배포) 미사용 슬래시 커맨드 8개를
  # 모델-facing 목록에서 완전히 숨긴다. permissions.deny로는 호출만 막히고
  # 목록엔 그대로 노출됨을 실측 확인했으며, skillOverrides: "off"만 목록에서 제거된다.
  # (따옴표 없는 off는 YAML boolean false로 파싱되므로 반드시 문자열로 쓴다.)
  skillOverrides:
    add-tracking: "off"
    cli: "off"
    commit: "off"
    fix: "off"
    init: "off"
    pr: "off"
    search-docs: "off"
    seo-routes: "off"

hooks:
  PreToolUse:
    # verify-entrypoint-gate: 무필터 test/lint deny + entrypoint 화이트리스트.
    # 스크립트는 글로벌 단일본($HOME/.claude/scripts/verify-entrypoint-gate/)으로 배포되고
    # (루트 sync.yaml scripts 섹션), 여기서는 raw command로 그 경로를 참조해 등록만 한다
    # — 워크트리마다 복사하지 않고, 발동은 acme-home 한정. base 정책은
    # index.ts가 import.meta.url 기준(스크립트 옆)으로 로드하므로 글로벌 위치에서 정상 동작.
    - command: "bun run $HOME/.claude/scripts/verify-entrypoint-gate/index.ts"
      matcher: "Bash"
      timeout: 10

mcps:
  notion-acme:
    type: http
    url: "https://mcp.notion.com/mcp"
  # ── 토스페이먼츠 MCP 2종: 지금은 불필요해 비활성. 쓸 일이 생기면 아래 블록의
  # 주석만 풀고 `make sync`를 돌리면 된다.
  #
  # 주의: 여기서 다시 주석처리해도 이미 배포된 건 꺼지지 않는다. MCP 배포는
  # tools/adapters/claude.ts의 syncMcpsMerge가 mcpServers[name] = json 단순
  # 대입으로 처리하는 추가 전용 경로라 삭제 수단이 없다(config/hooks의 null
  # merge-patch 삭제는 settings.local.json 쪽 얘기라 여기 적용 안 됨).
  # 끌 때는 ~/.claude.json의 projects["…/acme-home/.bare"].mcpServers에서
  # 직접 지워야 한다.
  #
  # 연동가이드 MCP. 호스팅 엔드포인트가 없는 stdio 전용 패키지이며
  # (mcp.tosspayments.com은 마케팅 사이트로 가는 301일 뿐 MCP가 아니다),
  # docs.tosspayments.com/llms.txt를 긁어오는 로컬 서버다. 0.0.x 대역이라
  # 공식 가이드대로 @latest를 쓴다 — 핀 고정하면 금방 낡는다.
  # tosspayments-guide:
  #   command: npx
  #   args:
  #     - "-y"
  #     - "@tosspayments/integration-guide-mcp@latest"
  #
  # TechChat MCP. 연동가이드와 별개 서버다(문서 조회가 아니라 Q&A).
  # 원래 OMT 밖에서 수동 등록돼 있던 것을 여기로 옮겨 적었다.
  # techchat-discord:
  #   type: http
  #   url: "https://techchat.tosspayments.com/mcp"
