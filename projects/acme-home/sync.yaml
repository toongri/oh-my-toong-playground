name: acme-home
path: ~/repos/acme-home
platforms: [claude]

provision:
  # 바이너리 설치는 루트 sync.yaml에서 전역 처리. 여기선 repo별 인덱스만.
  - check: "test -f .codegraph/codegraph.db"
    commands:
      - "codegraph init"

scripts:
  items:
    # verify-entrypoint-gate 프로젝트 오버레이. component 미스코프 참조라 own-project
    # 우선(projects/acme-home/scripts/verify-entrypoint-gate/)으로 해석되어 그
    # 디렉터리(=.local.yaml만 담은) 전체가 각 워크트리의
    # .claude/scripts/verify-entrypoint-gate/ + .codex/scripts/verify-entrypoint-gate/에
    # 배포된다 — index.ts의 resolveLocalDir()가 그 두 경로에서(.claude 우선) 프로젝트
    # 오버레이를 읽는 위치와 정확히 일치. 훅 등록 자체는 이 프로젝트의 claude.yaml과
    # 루트 codex.yaml이 담당하고(전역 단일본 index.ts를 raw command로 참조), 여기서는
    # 오버레이 정책만 배포한다. 다만 이 오버레이는 정책일 뿐 아니라 무장 스위치다 —
    # 루트 codex.yaml 등록은 전역이라 모든 레포에서 호출되고, index.ts의 findOverlayDir가
    # 이 파일을 찾은 레포에서만 판정한다. 즉 이 항목을 지우면 게이트가 조용히 꺼진다.
    - component: verify-entrypoint-gate
      platforms: [claude, codex]
