# 회사용 hosted MCP 3종. 전역이 아닌 프로젝트-로컬로 두는 이유는
# projects/acme-home/claude.yaml과 동일하다 — notion/linear/slack은 회사
# 워크스페이스와 개인 계정이 달라 전역 한 벌로는 계정이 하나로 고정된다.
# type: http라 프로세스가 뜨지 않아 램 비용은 0.
#
# 서버 이름은 acme-home과 동일하게 유지한다 — OAuth 토큰이 MCP 서버 이름
# 단위로 저장되므로, 같은 이름이면 이미 인증된 회사 계정 토큰을 재인증 없이
# 재사용한다.
#
# 착지점은 ~/.claude.json의 projects["…/acme-home-metrics/.bare"].mcpServers.
# 키가 .bare라 이 레포의 모든 워크트리가 등록을 공유한다.
mcps:
  notion-acme:
    type: http
    url: "https://mcp.notion.com/mcp"
  linear:
    type: http
    url: "https://mcp.linear.app/mcp"
  # Slack은 DCR을 거부하므로 Slack이 공개한 pre-registered public client로
  # OAuth(PKCE)한다. clientId/callbackPort는 Claude Code 연동용 공개 값.
  slack:
    type: http
    url: "https://mcp.slack.com/mcp"
    oauth:
      clientId: "1601185624273.8899143856786"
      callbackPort: 3118
