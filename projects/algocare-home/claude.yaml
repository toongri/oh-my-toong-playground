# config·hooks·mcps는 대상 프로젝트의 .claude/settings.local.json으로 배포된다
# (전역 sync만 settings.json). settings.local.json은 대상 레포에서 gitignore되므로
# (algocare-home .gitignore) 여기 둔 개인 절대경로도 팀 레포엔 커밋되지 않는다.
# OMT의 claude.yaml(git 추적)과 claude.local.yaml(gitignore)은 "OMT 레포에
# 버전관리하느냐"의 축일 뿐 — 배포 착지점은 둘 다 gitignore된 settings.local.json.
# 메커니즘 전문: docs/platform-yaml-config-deployment.md
config:
  env:
    # 워크트리 공유 turbo 캐시(해시키드 경로 지정, 캐시 무효화 아님).
    TURBO_CACHE_DIR: "/Users/toong/Library/Caches/algocare-home/turbo"
  # algocare-home 레포에 직접 커밋된(OMT 미배포) 미사용 슬래시 커맨드 8개를
  # 모델-facing 목록에서 완전히 숨긴다. permissions.deny로는 호출만 막히고
  # 목록엔 그대로 노출됨을 실측 확인했으며, skillOverrides: "off"만 목록에서 제거된다.
  # (따옴표 없는 off는 YAML boolean false로 파싱되므로 반드시 문자열로 쓴다.)
  skillOverrides:
    add-tracking: "off"
    cli: "off"
    commit: "off"
    fix: "off"
    init: "off"
    pr: "off"
    search-docs: "off"
    seo-routes: "off"

hooks:
  PreToolUse:
    # verify-entrypoint-gate: 무필터 test/lint deny + entrypoint 화이트리스트.
    # 스크립트는 글로벌 단일본($HOME/.claude/scripts/verify-entrypoint-gate/)으로 배포되고
    # (루트 sync.yaml scripts 섹션), 여기서는 raw command로 그 경로를 참조해 등록만 한다
    # — 워크트리마다 복사하지 않고, 발동은 algocare-home 한정. base 정책은
    # index.ts가 import.meta.url 기준(스크립트 옆)으로 로드하므로 글로벌 위치에서 정상 동작.
    - command: "bun run $HOME/.claude/scripts/verify-entrypoint-gate/index.ts"
      matcher: "Bash"
      timeout: 10

# 업무용 MCP는 전부 여기 모은다. 두 가지 이유가 겹친다.
#   1) 램 — stdio MCP는 세션마다 프로세스로 뜬다(실측: postgres 99MB /
#      opensearch 86MB). 전역에 두면 OMT나 개인 레포 세션도 쓰지도 않는
#      2종을 물어 세션당 185MB를 낭비한다. codegraph·playwright는 레포를 가리지
#      않고 쓰므로 전역에 남긴다.
#      이 수치는 소스 선언 기준이다. sync는 선언된 MCP를 대입만 하므로 여기서
#      지워도 이미 배포된 ~/.claude.json 항목은 그대로 남는다 — 이미 sync한
#      머신에서는 `claude mcp remove <name>`으로 배포본을 정리해야 185MB가 성립한다.
#   2) 계정 분리 — notion/linear/slack/sentry는 회사 워크스페이스와 개인 계정이
#      다르다. OAuth 토큰이 MCP 서버 이름 단위로 저장되므로, 전역에 한 벌만 두면
#      회사/개인 중 하나로 고정된다. type: http라 프로세스는 뜨지 않아 램은 0.
#
# 착지점은 ~/.claude.json의 projects["…/algocare-home/.bare"].mcpServers다. 키가
# .bare라 algocare-home의 모든 워크트리가 이 등록을 공유한다.
mcps:
  # 이름을 notion으로 바꾸지 않는다 — OAuth 토큰이 서버 이름에 묶여 있어 개명하면
  # 재인증해야 한다. 회사용임이 이름에 드러나는 편이 낫기도 하다.
  notion-algocare:
    type: http
    url: "https://mcp.notion.com/mcp"
  # Linear hosted MCP. Claude Code supports remote HTTP natively (Linear allows DCR), so no mcp-remote proxy needed.
  linear:
    type: http
    url: "https://mcp.linear.app/mcp"
  # Slack hosted MCP. Rejects dynamic client registration, so OAuth needs Slack's pre-registered public client
  # (no secret, PKCE). clientId/callbackPort are Slack's published values for the Claude Code integration.
  slack:
    type: http
    url: "https://mcp.slack.com/mcp"
    oauth:
      clientId: "1601185624273.8899143856786"
      callbackPort: 3118
  # Sentry hosted MCP. Streamable HTTP; the server allows DCR, so a bare url
  # triggers OAuth automatically (no pre-registered client). Authenticate via /mcp.
  sentry:
    type: http
    url: "https://mcp.sentry.dev/mcp"
  # playwright는 레포를 가리지 않고 쓰므로 전역(루트 claude.yaml)에 둔다.
  # Requires shell env: OPENSEARCH_URL, OPENSEARCH_USERNAME, OPENSEARCH_PASSWORD
  # (AWS: AWS_REGION, AWS_IAM_ARN or AWS_PROFILE). See opensearch-project/opensearch-mcp-server-py.
  opensearch:
    command: uvx
    args:
      - "opensearch-mcp-server-py"
  # Postgres MCP Pro (crystaldba/postgres-mcp). Read-only via --access-mode=restricted
  # (enforces read-only transactions + a query-time cap). Requires shell env: DATABASE_URI
  # (postgresql://user:pass@host:5432/dbname). uvx installs PyPI v0.3.0; for Jan-2026
  # fixes install from git main. https://github.com/crystaldba/postgres-mcp
  # `--with mcp<2`는 mcp SDK를 1.x로 고정한다: postgres-mcp 0.3.0은
  # mcp.server.fastmcp를 import하는데 mcp 2.0.0이 이 모듈을 제거했고, 의존성
  # 선언이 `mcp[cli]>=1.5.0`(상한 없음)이라 uvx가 2.x를 끌어와 서버가 import에서
  # 즉사한다(클라이언트에는 "connection closed: initialize response"로 보임).
  # upstream이 mcp 2.0 대응 릴리스를 내면 핀을 제거한다.
  postgres:
    command: uvx
    args:
      - "--with"
      - "mcp<2"
      - "postgres-mcp"
      - "--access-mode=restricted"
  # ── 토스페이먼츠 MCP 2종: 지금은 불필요해 비활성. 쓸 일이 생기면 아래 블록의
  # 주석만 풀고 `make sync`를 돌리면 된다.
  #
  # 주의: 여기서 다시 주석처리해도 이미 배포된 건 꺼지지 않는다. MCP 배포는
  # tools/adapters/claude.ts의 syncMcpsMerge가 mcpServers[name] = json 단순
  # 대입으로 처리하는 추가 전용 경로라 삭제 수단이 없다(config/hooks의 null
  # merge-patch 삭제는 settings.local.json 쪽 얘기라 여기 적용 안 됨).
  # 끌 때는 ~/.claude.json의 projects["…/algocare-home/.bare"].mcpServers에서
  # 직접 지워야 한다.
  #
  # 연동가이드 MCP. 호스팅 엔드포인트가 없는 stdio 전용 패키지이며
  # (mcp.tosspayments.com은 마케팅 사이트로 가는 301일 뿐 MCP가 아니다),
  # docs.tosspayments.com/llms.txt를 긁어오는 로컬 서버다. 0.0.x 대역이라
  # 공식 가이드대로 @latest를 쓴다 — 핀 고정하면 금방 낡는다.
  # tosspayments-guide:
  #   command: npx
  #   args:
  #     - "-y"
  #     - "@tosspayments/integration-guide-mcp@latest"
  #
  # TechChat MCP. 연동가이드와 별개 서버다(문서 조회가 아니라 Q&A).
  # 원래 OMT 밖에서 수동 등록돼 있던 것을 여기로 옮겨 적었다.
  # techchat-discord:
  #   type: http
  #   url: "https://techchat.tosspayments.com/mcp"
