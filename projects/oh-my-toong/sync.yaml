name: oh-my-toong
path: ~/repos/oh-my-toong-playground/main

agents:
  items:
    - explore
    - librarian
    - metis
    - mnemosyne
    - momus
    - oracle
    - daedalus
    - chunk-reviewer
    - code-reviewer
    - sisyphus-junior
    - hermes
    - issue-reviewer

skills:
  # 전역 skill은 루트 sync.yaml/sync.local.yaml이 배포하므로 self-sync에서
  # 재나열하지 않는다 — codex는 스킬 dedup을 물리 파일 경로로 하므로
  # (openai/codex의 codex-rs/ext/skills 아래 loader/host_merge.rs,
  # skills.retain(|skill| seen_paths.insert(skill.path_to_skills_md.clone())))
  # 이름이 같아도 홈(<home>/.agents/skills)·프로젝트(<repo>/.agents/skills) 사본이
  # 둘 다 로드되어 스킬 목록에 두 번 실리고 2% 스킬 컨텍스트 예산을 잠식한다
  # (실측: codex v0.146.1, --cd <repo>에서 22개 이름이 2회씩 등장하고
  # "Skill descriptions were shortened to fit the 2% skills context budget"
  # 경고 발생). Claude Code는 스킬에서 personal이 project를 이기므로
  # (공식 문서 "personal overrides project") 프로젝트 배포가 애초에
  # 가려져 있었다. 여기엔 프로젝트 전용 skill만 둔다.
  items:
    - technical-copywriting

rules:
  # 전역 rule(tool-usage-policy·work-principles·coding-discipline·least-code·
  # agent-browser-usage·codebase-grounding)은 루트 sync.yaml이 ~/.claude/rules/로
  # 배포하므로 self-sync에서 재나열하지 않는다 — 중복 로드 방지. 여기엔 프로젝트
  # 전용 rule만 둔다.
  items:
    - component-docs-currency
    - documentation-currency
    - rules-docs-authoring
    - sync-operations
