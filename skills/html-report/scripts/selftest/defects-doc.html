<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lint document self-test: planted doc defects</title>
<style>
/* html-lang: the root has no lang attribute. body-bg-transparent: body sets no background. */
body { margin: 0; color: #1a1a1a; font: 16px/1.6 system-ui, sans-serif; padding: 24px 16px; }
/* theme-token-scope: --only-dark is declared only inside the dark block, and .hard-coded holds a literal colour outside the token blocks */
@media (prefers-color-scheme: dark) { :root { --only-dark: #222222; } }
.hard-coded { color: #aa0000; }
</style>
</head>
<body>
<p>A page with no lang attribute and no body background.</p>
<p id="dup" class="hard-coded">first element with the id</p>
<p id="dup">second element with the same id</p>
</body>
</html>
