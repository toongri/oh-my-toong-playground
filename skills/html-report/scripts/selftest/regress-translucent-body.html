<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lint regression translucent body</title>
<style>
/* translucent body over a transparent html: the canvas shows through, so body-bg-transparent must fire once */
:root { --ink: #1a1a1a; color-scheme: light; }
body { margin: 0; background: rgba(255, 255, 255, 0.5); color: var(--ink); font: 16px/1.6 system-ui, sans-serif; padding: 24px 16px; }
</style>
</head>
<body>
<p>Half-transparent body, transparent html.</p>
</body>
</html>
