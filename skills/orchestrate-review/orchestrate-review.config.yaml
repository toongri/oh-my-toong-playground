chunk-review:
  # STATIC REVIEW ONLY: every finder is limited to diff/read/search evidence.
  # Tests, builds, linters, installers/installs, and project-code execution are
  # forbidden even when fast, cheap, relevant, or decisive; surface unresolved
  # uncertainty statically instead. Cleanup owns the light-touch Test value lens
  # (false confidence/fake coverage, verification value, feedback-loop cost), while
  # requirement owns AC mapping / acceptance criteria or intent inference.
  members:
    # Each member is a FINDER ANGLE, not a model. The multi-AI review fans out
    # one CLI invocation per angle, each given a distinct review lens via its
    # role prompt (scripts/prompts/<name>.md, auto-loaded by member name).
    # Finders surface raw candidates only — no verdict, no severity. The
    # upstream code-review skill verifies each candidate (assigns
    # CONFIRMED/PLAUSIBLE/REFUTED) and ranks the survivors.
    #
    # Per-angle model: each member carries its own command/model, so any angle
    # can run on a different CLI/model. 현재 배정은 앵글별 이종 구성이다:
    #   correctness=luna/xhigh · regression=luna/xhigh · cleanup=luna/xhigh ·
    #   requirement=luna/max
    # 최신 11-PR 재현 실측에서 correctness aggregate impact는 sol/medium 73 대
    # luna/xhigh 75로 사실상 동률이었다. 측정 비용은 sol/medium 약 $18.40 대
    # luna/xhigh 약 $2.05였고, 고임팩트 결함 커버리지는 sol/medium 8/8 대
    # luna/xhigh 7/8이었다. luna가 놓친 유일한 고임팩트 항목은 PR #2595의
    # migration/backfill rollback impact 6이었다. 이 1/8 recall 격차는 아직
    # 입증된 우위가 아니며, 비용 지속 가능성이 더 중요하므로 correctness도
    # luna/xhigh로 전환한다. regression·cleanup은 luna/xhigh, requirement는
    # luna/max를 유지한다.
    # `model` + `effort_level` + `output_format` (below) plus
    # `settings.deny.skills` (below) resolve (via buildAugmentedCommand) to:
    #   codex exec -c agents.enabled=false -m <this member's model> \
    #     -c skills.config=[…from settings.deny.skills below…] \
    #     -c model_reasoning_effort=<this member's effort_level> --json --skip-git-repo-check
    # `agents.enabled=false` strips codex's subagent tool descriptions (spawn_agent etc.)
    # from the session entirely, so a finder can't spawn subagents even if asked to.
    # Note: codex uses bare model ids (no `openai/` prefix). 2026-08-02 스모크로
    # gpt-5.6-sol(low/medium)·gpt-5.6-luna(xhigh/max)·gpt-5.6-terra(high/xhigh)
    # 전 조합의 codex 수용을 확인했다. codex에는 unsupported model id의 자동
    # fallback이 없다 — 모델 교체 시 반드시 사전 스모크를 거칠 것. 긴급 폴백은
    # 전 앵글 `gpt-5.6-sol`/medium(직전 검증 구성).
    # Change one member's `model`/`command` to run that angle on a different model/CLI.
    #
    # Angle set: 4 angles, each asking a distinct question about the diff —
    # `correctness` (does this code misbehave, including under input an
    # attacker controls), `regression` (what did this change remove),
    # `cleanup` (is this more than necessary), `requirement` (was what was
    # asked for actually done, and is it actually verified).
    - name: correctness
      command: codex exec -c agents.enabled=false
      model: gpt-5.6-luna
      emoji: "\U0001F517"
      color: "CYAN"
      effort_level: xhigh
      output_format: json
    - name: regression
      command: codex exec -c agents.enabled=false
      model: gpt-5.6-luna
      emoji: "\U0001F5D1"
      color: "MAGENTA"
      effort_level: xhigh
      output_format: json
    - name: cleanup
      command: codex exec -c agents.enabled=false
      model: gpt-5.6-luna
      emoji: "\U0001F9F9"
      color: "YELLOW"
      effort_level: xhigh
      output_format: json
    - name: requirement
      command: codex exec -c agents.enabled=false
      model: gpt-5.6-luna
      emoji: "\U0001F4CB"
      color: "GREEN"
      effort_level: max
      output_format: json
  settings:
    # 2700 = 행 킬 안전장치이지 정상 런 상한이 아니다. 1800이던 시절 37파일 diff에서
    # luna 레인이 절단됐고(절단분까지가 그 앵글 최고점 — 즉 절단은 과소평가 방향),
    # 정상 런은 이 값에 닿지 않는다. 절단 시에도 부분 출력은 수확된다(fail-soft).
    timeout: 2700
    # No-op with the angle members above (no `claude` member to exclude); kept
    # for compatibility if a claude-hosted angle is added later.
    exclude_chairman_from_members: false
    deny:
      # Three separate reasons, not one list: (1) self-recursion fan-out guard, 3 skills — each
      # angle runs `codex exec`, which could otherwise invoke a review/council skill and spawn
      # another fan-out beneath this one; already live since `code-review` deploys to codex via
      # root `sync.yaml`'s `platforms: [claude, codex]`.
      # (2) role-boundary guard, `diagnose` alone — a finder must surface un-judged candidates,
      # not verify them (that's the upstream code-review skill's job), and `diagnose` (a
      # READ-ONLY root-cause consultant) would pull a finder across that line.
      # (3) prompt-budget guard, the remaining 36 — none help a finder read code and surface
      # candidates, so each is dead prompt weight; the size this saves is pinned by
      # `codex-skill-deny-efficacy.test.ts`, not restated here.
      #
      # List stops at 40: further items are OpenAI-bundled plugin skills outside this repo,
      # named in `plugin:skill` colon form, which `lib/generic-job.ts`'s `assertDenySkillsShape`
      # rejects outright. Fail-open by design: a skill added later stays loadable — unlisted
      # means visible, the safe direction.
      skills:
        - agent-browser
        - agent-council
        - agent-device
        - clarify
        - code-review
        - collect-jd
        - craft-issue
        - create-slides
        - deep-interview
        - design-review
        - diagnose
        - dogfood
        - frontend
        - git-master
        - hud
        - humanizer
        - insane-browsing
        - make-pr
        - meeting-notes
        - momus
        - orchestrate-review
        - pin-audit
        - pin-query
        - pin-record
        - pin-setup
        - pin-wrap-up
        - prometheus
        - qa
        - receiving-code-review
        - review-report
        - scan-pdf-to-notes
        - sisyphus
        - slides-review
        - technical-copywriting
        - technical-writing
        - test-driven-development
        - ultragoal
        - ultraresearch
        - visual-qa
        - writing-skills
    mcps:
      # A review worker's codex process inherits every MCP server declared in
      # ~/.codex/config.toml regardless of whether it's used (measured: 13
      # servers configured on this host, 1 used by review workers). Only
      # codegraph is used — it's how each angle grounds findings in the real
      # call graph instead of a grep/read guess. Unlisted here means blocked,
      # for every server this engine can enumerate: this allowlist is opt-in
      # (fail-closed), the opposite default from `deny.skills` above — an
      # unspecified `mcps` or `mcps.allow` blocks every server
      # `enumerateConfiguredMcpServers` (lib/generic-job.ts) enumerates from
      # config.toml, so a config that never declares one doesn't silently
      # inherit the ambient config.toml's full MCP surface. Two carve-outs in
      # that same function: a server under a quoted TOML header
      # (`[mcp_servers."weird name"]`) is left unenumerated and stays
      # enabled — its name can't be passed safely as a
      # `-c mcp_servers.<name>.enabled=false` argument — and an unreadable
      # config.toml fails OPEN (nothing enumerated, nothing blocked).
      allow:
        - codegraph
