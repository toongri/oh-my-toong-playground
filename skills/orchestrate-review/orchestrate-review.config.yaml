chunk-review:
  members:
    # Each member is a FINDER ANGLE, not a model. The multi-AI review fans out
    # one CLI invocation per angle, each given a distinct review lens via its
    # role prompt (scripts/prompts/<name>.md, auto-loaded by member name).
    # Finders surface raw candidates only — no verdict, no severity. The
    # upstream code-review skill verifies each candidate (assigns
    # CONFIRMED/PLAUSIBLE/REFUTED) and ranks the survivors.
    #
    # Per-angle model: each member carries its own command/model, so any angle
    # can run on a different CLI/model. Today every angle runs on codex at gpt-5.6-sol,
    # medium reasoning effort. `model` + `effort_level` + `output_format` (below) plus
    # `settings.deny.skills` (below) resolve (via buildAugmentedCommand) to:
    #   codex exec -m gpt-5.6-sol -c skills.config=[…from settings.deny.skills below…] \
    #     -c model_reasoning_effort=medium --json --skip-git-repo-check
    # Note: codex uses bare model ids (no `openai/` prefix). Git history attests
    # codex with gpt-5.4 / gpt-5.3-codex (gpt-5.5 itself only ran via opencode);
    # if codex rejects `gpt-5.6-sol`, fall back to `gpt-5.5`.
    # Change one member's `model`/`command` to run that angle on a different model/CLI.
    #
    # Angle set: 4 angles, each asking a distinct question about the diff —
    # `correctness` (does this code misbehave), `regression` (what did this
    # change remove), `cleanup` (is this more than necessary), `requirement`
    # (was what was asked for actually done, is it actually verified, can an
    # attacker flip it).
    - name: correctness
      command: codex exec
      model: gpt-5.6-sol
      emoji: "\U0001F517"
      color: "CYAN"
      effort_level: medium
      output_format: json
    - name: regression
      command: codex exec
      model: gpt-5.6-sol
      emoji: "\U0001F5D1"
      color: "MAGENTA"
      effort_level: medium
      output_format: json
    - name: cleanup
      command: codex exec
      model: gpt-5.6-sol
      emoji: "\U0001F9F9"
      color: "YELLOW"
      effort_level: medium
      output_format: json
    - name: requirement
      command: codex exec
      model: gpt-5.6-sol
      emoji: "\U0001F4CB"
      color: "GREEN"
      effort_level: medium
      output_format: json
  settings:
    timeout: 1800
    # No-op with the angle members above (no `claude` member to exclude); kept
    # for compatibility if a claude-hosted angle is added later.
    exclude_chairman_from_members: false
    deny:
      # Self-recursion fan-out guard: each dispatched angle runs `codex exec`,
      # so without this it could itself invoke a review/council skill and
      # spawn another fan-out beneath this one. Blocks the 3 skills that can
      # start a review/council job. `code-review` is already deployed to
      # codex today — root `sync.yaml` declares `component: code-review`
      # with `platforms: [claude, codex]` — so this entry is live now, not
      # a dormant guard waiting on a future `platforms` change.
      #
      # Role-boundary guard (different reason from the three above — this one
      # is not about recursion). A finder's contract is to surface un-judged
      # candidates; assigning CONFIRMED/PLAUSIBLE/REFUTED belongs to the
      # upstream code-review skill's candidate-verification stage, where each
      # candidate is re-checked against HEAD before it earns a verdict. That
      # split is stated in every angle prompt's
      # CRITICAL block ("Do NOT assign severity, priority, P-levels, verdicts").
      # `diagnose` is a READ-ONLY root-cause consultant — loading it invites a
      # finder across exactly that line, into verifying its own candidates.
      # Effect measured 2026-07-27 via `codex debug prompt-input`:
      # `/diagnose/SKILL.md` occurrences 2 → 0 with this entry present.
      # NOT justified by a runtime measurement: a 26-minute `regression` run
      # was once cited here, but that job ran a hand-written prompt that
      # explicitly ordered mutation experiments, so it evidences
      # instruction-following, not skill-induced blowup. No standard-path
      # measurement shows `diagnose` costing time — this entry claims a
      # boundary, not a speedup.
      # Deny-listed rather than allow-listed: one identified offender, and a
      # blanket allowlist would also kill project-local skills a finder may
      # legitimately need. Revisit if another skill shows the same shape.
      #
      # Remaining 24 entries below: prompt-budget guard, distinct from both
      # reasons above. A finder's whole job is to read code and surface raw
      # candidates — no skill in this repo helps with that, so every one of
      # them is dead prompt weight for a finder specifically. Measured
      # 2026-07-27 via `codex debug prompt-input` (codex 0.145.0): with all 28
      # entries declared, the `<skills_instructions>` block shrinks
      # 21,250 chars → 9,890 chars, and the full rendered prompt shrinks
      # 69,924 chars → 58,564 chars (−11,360 chars).
      #
      # Why the list stops at 28: `codex debug prompt-input` also lists ~20
      # further items, but every one of them is an OpenAI-bundled plugin
      # skill outside this repo (`pdf`, `spreadsheets`, `presentations`,
      # `sites-building`, `excel-live-control`, etc.) — a finder has no
      # occasion to touch those, and their names take the `plugin:skill`
      # colon form, which `lib/generic-job.ts`'s `assertDenySkillsShape`
      # (`/^[a-zA-Z0-9_-]+$/`) rejects outright. Loosening that regex is a
      # shared-file change and out of scope here.
      #
      # Staleness: a skill added to this repo after 2026-07-27 won't appear
      # here and will stay loadable by a finder — identical to today's
      # behavior before this list existed. Failing open (unlisted = visible)
      # is the safe direction; it costs prompt budget, not correctness.
      skills:
        - agent-browser
        - agent-council
        - clarify
        - code-review
        - collect-jd
        - craft-issue
        - create-slides
        - deep-interview
        - design-review
        - diagnose
        - git-master
        - goal
        - hud
        - humanizer
        - insane-browsing
        - make-pr
        - momus
        - orchestrate-review
        - prometheus
        - qa
        - review-report
        - scan-pdf-to-notes
        - sisyphus
        - slides-review
        - technical-copywriting
        - technical-writing
        - ultragoal
        - ultraresearch
