# Agent Council Configuration
# Add or remove council members as needed.
# Note: an unavailable CLI reports `missing_cli` at runtime; but while
# settings.deny.skills is declared below, a member whose CLI has no
# skill-deny lever (gemini / unrecognized) makes `start` exit 1 before any
# job directory is created.

council:
  # Council members configuration
  # Each member needs:
  #   - name: identifier for the agent
  #   - command: CLI command to execute (prompt will be appended)
  #   - emoji: display emoji (optional)
  #   - color: ANSI color (RED, GREEN, BLUE, YELLOW, CYAN)
  #
  # Per-member CLI configuration (all optional):
  #   model:         Model name passed to CLI (claude/gemini: --model, codex: -m)
  #   effort_level:  Thinking effort (low/medium/high)
  #                  claude: env CLAUDE_CODE_EFFORT_LEVEL, codex: -c flag, gemini: ignored
  #
  # `name` never selects the model — it only binds the role prompt
  # (`prompts/<name>.md`, falling back to `prompts/default.md`) and labels the
  # member's output. The model comes solely from `model:` below; omitting it
  # would leave the CLI on its own configured default, not on the name.
  members:
    - name: sol
      command: codex exec
      emoji: "🤖"
      color: "BLUE"
      model: "gpt-5.6-sol"
      effort_level: "high"
      output_format: json

    - name: terra
      command: codex exec
      emoji: "🌍"
      color: "GREEN"
      model: "gpt-5.6-terra"
      effort_level: "high"
      output_format: json

    - name: glm
      command: "opencode run"
      emoji: "🟣"
      color: "YELLOW"
      model: "opencode-go/glm-5.2"
      output_format: json

  # Execution settings
  settings:
    # No-op with the members above (no `claude` member to exclude); the chairman is
    # the calling Claude session, which synthesizes rather than arguing a seat.
    exclude_chairman_from_members: false
    timeout: 2400                         # Timeout seconds per agent (0 to disable)
    deny:
      # Subagent axis: a council member argues its own assigned perspective alone. Spawning is a
      # second fan-out beneath this one — unbudgeted cost, and opinions no perspective prompt
      # shaped. Translated per member CLI by `buildAugmentedCommand` (codex: `-c
      # agents.enabled=false`, claude: `--settings permissions.deny`, opencode: `permission.task`);
      # a member on a CLI with no such lever fails `start` rather than running unguarded.
      subagents: true
      # Three separate reasons, not one list: (1) self-recursion fan-out guard, 3 skills — members
      # run claude/codex/opencode CLIs that could themselves invoke a review/council skill and spawn
      # another fan-out beneath this one; already live since `code-review` deploys to codex via root
      # `sync.yaml`'s `platforms: [claude, codex]`.
      # (2) role-boundary guard, `diagnose` alone — reasoned on the review side (a finder must
      # surface un-judged candidates, and `diagnose` invites verifying them instead); council members
      # fan out through the same `lib/generic-job.ts` spawn path with the same free skill loading, so
      # the shape carries over even though no council run has shown it.
      # (3) prompt-budget guard, the remaining 37 — no skill here is relevant to a member's job of
      # arguing its assigned perspective, so each is dead weight; the size saved is pinned by
      # `codex-skill-deny-efficacy.test.ts`, not restated here.
      #
      # List stops at 41 (OpenAI-bundled plugin skills use `plugin:skill` colon form, rejected by
      # `lib/generic-job.ts`'s `assertDenyShape`); fail-open by design (unlisted means visible,
      # the safe direction).
      # Kept in lockstep with the other job configs (`code-review`, `agent-council`,
      # `design-review`, `diagnose`) — `codex-skill-deny-efficacy.test.ts` asserts all four
      # declare the same set.
      skills:
        - agent-browser
        - agent-council
        - agent-device
        - clarify
        - code-review
        - collect-jd
        - craft-issue
        - create-slides
        - deep-interview
        - design-review
        - diagnose
        - dogfood
        - explain-diff
        - frontend
        - git-master
        - hud
        - humanizer
        - insane-browsing
        - make-pr
        - meeting-notes
        - momus
        - pin-audit
        - pin-query
        - pin-record
        - pin-setup
        - pin-wrap-up
        - prometheus
        - qa
        - receiving-code-review
        - review-report
        - scan-pdf-to-notes
        - sisyphus
        - slides-review
        - technical-copywriting
        - technical-writing
        - test-driven-development
        - ultragoal
        - ultraresearch
        - visual-qa
        - writing-skills
