# Agent Council Configuration
# Add or remove council members as needed.
# Note: an unavailable CLI reports `missing_cli` at runtime; but while
# settings.deny.skills is declared below, a member whose CLI has no
# skill-deny lever (gemini / unrecognized) makes `start` exit 1 before any
# job directory is created.

council:
  # Council members configuration
  # Each member needs:
  #   - name: identifier for the agent
  #   - command: CLI command to execute (prompt will be appended)
  #   - emoji: display emoji (optional)
  #   - color: ANSI color (RED, GREEN, BLUE, YELLOW, CYAN)
  #
  # Per-member CLI configuration (all optional):
  #   model:         Model name passed to CLI (claude/gemini: --model, codex: -m)
  #   effort_level:  Thinking effort (low/medium/high)
  #                  claude: env CLAUDE_CODE_EFFORT_LEVEL, codex: -c flag, gemini: ignored
  members:
    - name: claude
      command: "claude -p"
      emoji: "🧠"
      color: "CYAN"
      model: "claude-opus-4-7"
      effort_level: "xhigh"

    - name: gpt
      command: codex exec
      emoji: "🤖"
      color: "BLUE"
      model: "gpt-5.6-sol"
      effort_level: "high"
      output_format: json

    - name: glm
      command: "opencode run"
      emoji: "🟣"
      color: "YELLOW"
      model: "opencode-go/glm-5.2"
      output_format: json

  # Execution settings
  settings:
    exclude_chairman_from_members: false  # Chairman also participates as a council member
    timeout: 1200                         # Timeout seconds per agent (0 to disable)
    deny:
      # Self-recursion fan-out guard: members run claude/codex/opencode CLIs
      # that could themselves invoke a review/council skill, spawning another
      # fan-out beneath this one. Blocks the 3 skills that can start one.
      # `code-review` is already deployed to codex today — root `sync.yaml`
      # declares `component: code-review` with `platforms: [claude, codex]`
      # — so this entry is live now, not a dormant no-op waiting on a
      # future `platforms` change.
      #
      # Role-boundary guard (different reason from the three above — not
      # recursion). Reasoned on the review side, not here: a finder must
      # surface un-judged candidates, and `diagnose` (a READ-ONLY root-cause
      # consultant) invites it into verifying them instead — work that belongs
      # to the upstream code-review skill. Council members fan out through the
      # same `lib/generic-job.ts` spawn path with the same free skill loading,
      # so the shape carries over even though no council run has shown it.
      #
      # Remaining 24 entries below: prompt-budget guard, distinct from both
      # reasons above. A council member's job is to argue its assigned
      # perspective on the question put to it — no skill in this repo is
      # relevant to that, so each one is dead prompt weight for every member.
      # Measured 2026-07-27 via `codex debug prompt-input` (codex 0.145.0,
      # same transport `gpt`'s `codex exec` member uses): with all 28 entries
      # declared, the `<skills_instructions>` block shrinks 21,250 chars →
      # 9,890 chars, and the full rendered prompt shrinks 69,924 chars →
      # 58,564 chars (−11,360 chars).
      #
      # Why the list stops at 28: `codex debug prompt-input` also lists ~20
      # further items, but every one of them is an OpenAI-bundled plugin
      # skill outside this repo (`pdf`, `spreadsheets`, `presentations`,
      # `sites-building`, `excel-live-control`, etc.) — a council member has
      # no occasion to touch those, and their names take the `plugin:skill`
      # colon form, which `lib/generic-job.ts`'s `assertDenySkillsShape`
      # (`/^[a-zA-Z0-9_-]+$/`) rejects outright. Loosening that regex is a
      # shared-file change and out of scope here.
      #
      # Staleness: a skill added to this repo after 2026-07-27 won't appear
      # here and will stay loadable by a member — identical to today's
      # behavior before this list existed. Failing open (unlisted = visible)
      # is the safe direction; it costs prompt budget, not correctness.
      #
      # Kept in lockstep with `orchestrate-review.config.yaml` —
      # `codex-skill-deny-efficacy.test.ts` asserts the two files declare the
      # same set.
      skills:
        - agent-browser
        - agent-council
        - clarify
        - code-review
        - collect-jd
        - craft-issue
        - create-slides
        - deep-interview
        - design-review
        - diagnose
        - git-master
        - goal
        - hud
        - humanizer
        - insane-browsing
        - make-pr
        - momus
        - orchestrate-review
        - prometheus
        - qa
        - review-report
        - scan-pdf-to-notes
        - sisyphus
        - slides-review
        - technical-copywriting
        - technical-writing
        - ultragoal
        - ultraresearch
