# Design Review Configuration
# External dispatch: one codex reviewer (gpt-5.6-sol, high reasoning) via `codex exec`.
# model + effort_level + output_format resolve to:
#   codex exec -m gpt-5.6-sol -c model_reasoning_effort=high --json --skip-git-repo-check
# codex uses bare model ids (no `openai/` prefix).

review:
  members:
    - name: gpt
      command: codex exec
      emoji: "🤖"
      color: "BLUE"
      model: "gpt-5.6-sol"
      effort_level: "high"
      output_format: json

  settings:
    timeout: 2400
    deny:
      # Subagent axis: the reviewer answers the design question alone. Spawning is a second
      # fan-out beneath this one — unbudgeted cost, and counsel no review prompt shaped.
      # Translated per member CLI by `buildAugmentedCommand` (codex: `-c agents.enabled=false`);
      # a member on a CLI with no such lever fails `start` rather than running unguarded.
      subagents: true
      # Three separate reasons, not one list: (1) self-recursion fan-out guard, 3 skills — this
      # reviewer runs `codex exec`, which could otherwise invoke a review/council skill and spawn
      # another fan-out beneath this one; already live since `code-review` deploys to codex via
      # root `sync.yaml`'s `platforms: [claude, codex]`.
      # (2) role-boundary guard, `diagnose` alone — this reviewer gives advisory design counsel,
      # not a root-cause verdict, and `diagnose` would pull it across that line.
      # (3) prompt-budget guard, the remaining 37 — none help reason about a design's tradeoffs,
      # so each is dead prompt weight; the size this saves is pinned by
      # `codex-skill-deny-efficacy.test.ts`, not restated here.
      #
      # List stops at 41: further items are OpenAI-bundled plugin skills outside this repo,
      # named in `plugin:skill` colon form, which `lib/generic-job.ts`'s `assertDenyShape`
      # rejects outright. Fail-open by design: a skill added later stays loadable — unlisted
      # means visible, the safe direction. Kept in lockstep with the other job configs
      # (`orchestrate-review`, `agent-council`, `design-review`, `diagnose`) —
      # `codex-skill-deny-efficacy.test.ts` asserts all four declare the same set.
      skills:
        - agent-browser
        - agent-council
        - agent-device
        - clarify
        - code-review
        - collect-jd
        - craft-issue
        - create-slides
        - deep-interview
        - design-review
        - diagnose
        - dogfood
        - explain-diff
        - frontend
        - git-master
        - hud
        - humanizer
        - insane-browsing
        - make-pr
        - meeting-notes
        - momus
        - orchestrate-review
        - pin-audit
        - pin-query
        - pin-record
        - pin-setup
        - pin-wrap-up
        - prometheus
        - qa
        - receiving-code-review
        - review-report
        - scan-pdf-to-notes
        - sisyphus
        - slides-review
        - technical-copywriting
        - technical-writing
        - test-driven-development
        - ultragoal
        - ultraresearch
        - visual-qa
        - writing-skills
    mcps:
      # This reviewer's codex process inherits every MCP server declared in
      # ~/.codex/config.toml regardless of whether it's used. Only codegraph is
      # used — it's how the reviewer checks a design claim against the real call
      # graph instead of a grep/read guess. Unlisted here means blocked, for
      # every server this engine can enumerate: this allowlist is opt-in
      # (fail-closed), the opposite default from `deny.skills` above — an
      # unspecified `mcps` or `mcps.allow` blocks every server
      # `enumerateConfiguredMcpServers` (lib/generic-job.ts) enumerates from
      # config.toml. Two carve-outs in that same function: a server under a
      # quoted TOML header (`[mcp_servers."weird name"]`) is left unenumerated
      # and stays enabled — its name can't be passed safely as a
      # `-c mcp_servers.<name>.enabled=false` argument — and an unreadable
      # config.toml fails OPEN.
      allow:
        - codegraph
