<!DOCTYPE html>
<html lang="{{LANG_CODE}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{HTML_TITLE}}</title>
<style>
:root {
  --bg: #fafafa;
  --panel: #ffffff;
  --text: #1a1a1a;
  --muted: #566074;
  --border: #e5e7eb;
  --accent: #2563eb;
  --accent-bg: #eff6ff;
  --code-bg: #f3f4f6;
  --ok: #059669;
  --warn: #d97706;
  --info: #7c3aed;
  --danger: #dc2626;
  --danger-ink: #b91c1c;
  --warn-ink: #92400e;
  /* html-report token names, aliased onto the tokens above so its SVG recipes work unchanged */
  --surface: var(--panel); --surface-2: var(--code-bg);
  --ink: var(--text); --ink-2: var(--text); --ink-3: var(--muted);
  --line: var(--border); --line-strong: #8a93a6;
  --bad: var(--danger); --bad-bg: #fef2f2; --ok-bg: #ecfdf5; --warn-bg: #fffbeb;
  --bad-bg-deep: #fef2f2; --warn-bg-deep: #fffbeb;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115;
    --panel: #161921;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --border: #2a2f3a;
    --accent: #60a5fa;
    --accent-bg: #1e293b;
    --code-bg: #1a1f2b;
    --ok: #34d399;
    --warn: #fbbf24;
    --info: #a78bfa;
    --danger: #f87171;
    --danger-ink: #f87171;
    --warn-ink: #fbbf24;
    --line-strong: #566074;
    --bad-bg: #2d1515; --ok-bg: #10281f; --warn-bg: #2d2010;
    --bad-bg-deep: #1f1010; --warn-bg-deep: #1f1a08;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115;
  --panel: #161921;
  --text: #e5e7eb;
  --muted: #9ca3af;
  --border: #2a2f3a;
  --accent: #60a5fa;
  --accent-bg: #1e293b;
  --code-bg: #1a1f2b;
  --ok: #34d399;
  --warn: #fbbf24;
  --info: #a78bfa;
  --danger: #f87171;
  --danger-ink: #f87171;
  --warn-ink: #fbbf24;
  --line-strong: #566074;
  --bad-bg: #2d1515; --ok-bg: #10281f; --warn-bg: #2d2010;
  --bad-bg-deep: #1f1010; --warn-bg-deep: #1f1a08;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  font-size: 15px;
  line-height: 1.65;
}
.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }
nav.toc {
  position: sticky; top: env(safe-area-inset-top, 0px);
  height: 100vh; overflow-y: auto;
  border-right: 1px solid var(--border);
  background: var(--panel);
  padding: 20px 16px;
  font-size: 13px;
}
nav.toc .title { font-weight: 700; color: var(--muted); text-transform: uppercase; font-size: 11px; letter-spacing: 1px; margin-bottom: 12px; }
nav.toc ul { list-style: none; padding: 0; margin: 0; }
nav.toc li { margin: 4px 0; }
nav.toc a { color: var(--muted); text-decoration: none; display: block; padding: 3px 6px; border-radius: 4px; }
nav.toc a:hover { background: var(--accent-bg); color: var(--accent); }
nav.toc .lvl-2 { padding-left: 0; }
nav.toc .lvl-3 { padding-left: 14px; font-size: 12px; }
nav.toc .lvl-4 { padding-left: 28px; font-size: 11.5px; color: var(--muted); }
main { padding: 32px max(48px, env(safe-area-inset-right, 0px)) 80px max(48px, env(safe-area-inset-left, 0px)); max-width: 960px; }
header.hero { border-bottom: 1px solid var(--border); margin-bottom: 24px; padding-bottom: 20px; }
header.hero .kicker { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
header.hero h1 { font-size: 28px; margin: 4px 0 4px; }
header.hero .meta { color: var(--muted); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
header.hero .meta .pill { background: var(--accent-bg); color: var(--accent); padding: 2px 10px; border-radius: 12px; font-weight: 600; }
header.hero .meta .pill.danger { background: var(--bad-bg); color: var(--danger-ink); }
header.hero .meta .pill.warn { background: var(--warn-bg); color: var(--warn-ink); }
.section-box { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 6px; padding: 16px 20px; margin: 20px 0; }
.section-box.ok { border-left-color: var(--ok); }
.section-box.warn { border-left-color: var(--warn); }
.section-box.info { border-left-color: var(--info); }
.section-box.danger { border-left-color: var(--danger); }
.section-box h3 { margin-top: 0; font-size: 15px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
.section-box h3 .tag { display: inline-block; background: var(--ok); color: white; padding: 1px 8px; border-radius: 10px; font-size: 11px; letter-spacing: 0.5px; margin-left: 8px; vertical-align: middle; }
.section-box.warn h3 .tag { background: var(--warn); }
.section-box.info h3 .tag { background: var(--info); }
.findings-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-top: 10px; }
.finding { min-width: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 10px 14px; font-size: 13.5px; }
.finding, .finding li { overflow-wrap: anywhere; }
.finding ul { padding-left: 18px; }
.finding .loc { color: var(--muted); font-size: 12px; font-family: ui-monospace, SF Mono, Menlo, monospace; }
.finding .sev { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-right: 8px; background: var(--accent-bg); color: var(--accent); }
.finding[data-verdict="CONFIRMED"] { border-left: 4px solid var(--danger); background: var(--bad-bg-deep); }
.finding[data-verdict="CONFIRMED"] .sev { background: var(--bad-bg); color: var(--danger); border: 1px solid var(--danger); }
.finding[data-verdict="PLAUSIBLE"] { border-left: 4px solid var(--warn); background: var(--warn-bg-deep); }
.finding[data-verdict="PLAUSIBLE"] .sev { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); }
article#review-content { padding-top: 8px; }
article h1 { display: none; }
article h2 { font-size: 22px; margin-top: 40px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
article h3 { font-size: 17px; margin-top: 28px; }
article h4 { font-size: 14.5px; margin-top: 20px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
article code { background: var(--code-bg); padding: 1px 5px; border-radius: 3px; font-size: 0.9em; font-family: ui-monospace, SF Mono, Menlo, monospace; }
article pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; padding: 12px 14px; overflow-x: auto; font-size: 12.5px; line-height: 1.5; }
article pre code { background: transparent; padding: 0; }
article table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 13.5px; }
article th, article td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; vertical-align: top; }
article th { background: var(--code-bg); font-weight: 600; }
article blockquote { border-left: 3px solid var(--accent); background: var(--accent-bg); margin: 14px 0; padding: 10px 14px; color: var(--text); }
article hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
article ul, article ol { padding-left: 22px; }
article li { margin: 3px 0; }
article li input[type="checkbox"] { margin-right: 6px; }
article a { color: var(--accent); }
article figure { margin: 22px 0; }
article figcaption { max-width: 760px; margin-top: 8px; font-size: 13.5px; color: var(--muted); }
.fig-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.fig-scroll svg { display: block; width: 100%; height: auto; }
.fig-hint, .edge-table { display: none; }
@media (max-width: 640px) { .fig-hint, .edge-table { display: block; } }
.edge-table { overflow-x: auto; }
.edge-table th, .edge-table td { overflow-wrap: anywhere; }
main, article#review-content, article figure { min-width: 0; }
svg text { font-family: inherit; font-size: 13px; fill: var(--ink); }
svg .t-b { font-weight: 700; }
svg .t-s { font-size: 12px; fill: var(--ink-2); }
svg .t-m { font-family: ui-monospace, SF Mono, Menlo, monospace; font-size: 12px; }
svg .box { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.5; }
svg .box.new { fill: var(--ok-bg); stroke: var(--ok); }
svg .box.mod { fill: var(--warn-bg); stroke: var(--warn); }
svg .rel { fill: none; stroke: var(--ink-3); stroke-width: 1.6; }
svg .rel.ret { stroke-dasharray: 6 5; }
svg .rel.key { stroke: var(--bad); stroke-width: 2; }
svg .mk-mut { fill: var(--ink-3); }
svg .mk-bad { fill: var(--bad); }
svg .life { stroke: var(--line-strong); stroke-dasharray: 3 3; fill: none; }
svg .act { fill: var(--surface-2); stroke: var(--line-strong); stroke-width: 1.2; }
svg .msg { fill: none; stroke: var(--ink-3); stroke-width: 1.4; }
svg .msg.ret { stroke-dasharray: 5 4; }
svg .dot { fill: var(--ink); }
svg .halo { paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; }
svg .mask { fill: var(--surface); }
svg .m { font-size: 12px; font-weight: 500; fill: var(--ink-2); }
.footer-note { margin-top: 60px; padding-top: 20px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  nav.toc { position: relative; height: auto; max-height: 300px; }
  main { padding: 20px max(20px, env(safe-area-inset-right, 0px)) 20px max(20px, env(safe-area-inset-left, 0px)); }
}
</style>
</head>
<body>
<div class="layout">
<nav class="toc"><div class="title">{{TOC_TITLE}}</div><ul id="toc">{{TOC_ITEMS_HTML}}</ul></nav>
<main>
<header class="hero">
  <div class="kicker">{{REVIEW_TITLE}}</div>
  <h1>{{HTML_TITLE}}</h1>
  <div class="meta">
    <span class="pill danger">{{CORRECTNESS_COUNT}}</span>
    <span class="pill">{{REQUIREMENT_GAP_COUNT}}</span>
    <span class="pill warn">{{CLEANUP_COUNT}}</span>
    <span>{{REVIEW_FILE_PATH}}</span>
  </div>
</header>

<article id="review-content">
{{REVIEW_BODY_HTML}}
</article>

<div class="footer-note">{{FOOTER_NOTE}}</div>

</main>
</div>

</body>
</html>
