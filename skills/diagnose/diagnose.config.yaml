# Diagnose Configuration
# External dispatch: one codex analyst (gpt-6-astra, high reasoning) via `codex exec`.
# model + effort_level + output_format resolve to:
#   codex exec -m gpt-6-astra -c model_reasoning_effort=high --json --skip-git-repo-check
# codex uses bare model ids (no `openai/` prefix).

review:
  members:
    - name: gpt
      command: codex exec
      emoji: "🔨"
      color: "BLUE"
      model: "gpt-6-astra"
      effort_level: "high"
      output_format: json

  settings:
    timeout: 1200
    deny:
      # Subagent axis: the analyst diagnoses alone. Spawning is a second fan-out beneath this
      # one — unbudgeted cost, and findings no analysis prompt shaped. Translated per member CLI
      # by `buildAugmentedCommand` (codex: `-c agents.enabled=false`); a member on a CLI with
      # no such lever fails `start` rather than running unguarded.
      subagents: true
      # Three separate reasons, not one list: (1) self-recursion fan-out guard, 3 skills — this
      # analyst runs a coding CLI that could otherwise invoke a review/council skill and spawn
      # another fan-out beneath this one; already live since `code-review` deploys to codex via
      # root `sync.yaml`'s `platforms: [claude, codex]`.
      # (2) role-boundary guard, `diagnose` alone — the worker IS the diagnosis; re-entering the
      # skill from inside it is recursion, not analysis.
      # (3) prompt-budget guard, the remaining 37 — none help read code and name a root cause,
      # so each is dead prompt weight; the size this saves is pinned by
      # `codex-skill-deny-efficacy.test.ts`, not restated here.
      #
      # List stops at 41: further items are OpenAI-bundled plugin skills outside this repo,
      # named in `plugin:skill` colon form, which `lib/generic-job.ts`'s `assertDenyShape`
      # rejects outright. Fail-open by design: a skill added later stays loadable — unlisted
      # means visible, the safe direction. Kept in lockstep with the other job configs
      # (`code-review`, `agent-council`, `design-review`, `diagnose`) —
      # `codex-skill-deny-efficacy.test.ts` asserts all four declare the same set.
      skills:
        - agent-browser
        - agent-council
        - agent-device
        - clarify
        - code-review
        - collect-jd
        - craft-issue
        - create-slides
        - deep-interview
        - design-review
        - diagnose
        - dogfood
        - explain-diff
        - frontend
        - git-master
        - hud
        - humanizer
        - insane-browsing
        - make-pr
        - meeting-notes
        - momus
        - pin-audit
        - pin-query
        - pin-record
        - pin-setup
        - pin-wrap-up
        - prometheus
        - qa
        - receiving-code-review
        - review-report
        - scan-pdf-to-notes
        - sisyphus
        - slides-review
        - technical-copywriting
        - technical-writing
        - test-driven-development
        - ultragoal
        - ultraresearch
        - visual-qa
        - writing-skills
